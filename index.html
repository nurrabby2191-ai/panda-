<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Story Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene">
        <!-- ফুল স্ক্রিন পান্ডা ও খামের ছবি -->
        <div class="panda-container" id="pandaScene">
            <img src="panda-envelope.png" alt="Panda with Envelope" class="panda-main-img">
            <!-- শুধুমাত্র খামের ওপরের অংশ (Hotspot) যেখানে ক্লিক করলে গল্প শুরু হবে -->
            <div class="envelope-hotspot" onclick="startStory()"></div>
        </div>

        <!-- পেপার বা স্লাইড কন্টেইনার (যেখানে আপনার ৪টি ছবি দেখাবে) -->
        <div class="paper" id="paperBox" onclick="nextStep()">
            <div id="contentArea"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
